# /etc/nginx/conf.d/vfd74-perf.conf — контекст http.
# Кеш-заголовки и Brotli для vfd74.ru. Подключается автоматически из
# nginx.conf (include /etc/nginx/conf.d/*.conf), сам vhost — vfd74.ru.conf.
#
# Кеш одной переменной, а не add_header в каждом location: add_header в
# location обнуляет заголовки, унаследованные с уровня server (HSTS пришлось бы
# дублировать), а `expires` + add_header Cache-Control давали два заголовка
# Cache-Control в одном ответе.
#   /_astro/ — файлы с хешем в имени: вечный кеш;
#   /fonts/  — шрифты не меняются под тем же именем: тоже год;
#   картинки, видео, pdf — 30 дней (имена без хеша: заменённое под тем же именем
#     фото не должно висеть в браузерах дольше);
#   остальное (HTML, sitemap, robots) — no-cache: браузер проверяет по ETag.
map $uri $vfd_cache_control {
    default                                                    "no-cache";
    ~^/_astro/                                                 "public, max-age=31536000, immutable";
    ~^/fonts/                                                  "public, max-age=31536000, immutable";
    ~*\.(woff2?|svg|webp|jpe?g|png|ico|avif|mp4|webm|pdf)$     "public, max-age=2592000";
}

# Brotli поверх gzip: HTML главной ~30 КБ gzip → ~23 КБ. Модуль:
# apt install libnginx-mod-http-brotli-filter (подключается из modules-enabled).
# Клиент без br получает gzip (gzip_types — в nginx.conf). HTML сжимается всегда.
brotli on;
brotli_comp_level 5;
brotli_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/ld+json application/manifest+json
    application/xml application/xml+rss image/svg+xml image/x-icon;
