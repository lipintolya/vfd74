# /etc/nginx/sites-available/vfd74.ru (симлинк в sites-enabled).
# Рядом лежит vfd74-perf.conf (map для кеша, Brotli). Файл правится руками:
# certbot правит только строки ssl_certificate*, остальное не трогает.
# Применять: deploy/nginx/README.md.
server {
    server_name vfd74.ru;

    root /var/www/vfd74.ru/html;
    index index.html;

    # Заголовки на уровне server — location без своих add_header их наследуют.
    # $vfd_cache_control — map из vfd74-perf.conf.
    add_header Cache-Control $vfd_cache_control always;
    # HSTS: повторный заход сразу по https, без редиректа http -> https.
    # Без includeSubDomains и preload — на поддомены не распространяется.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # В mime.types у nginx нет webmanifest — иначе отдаётся application/octet-stream.
    location = /favicons/site.webmanifest {
        default_type application/manifest+json;
    }

    # /models/ — «каталог» без страницы: есть только /models/<slug>/. Без этого
    # правила nginx отвечает 403 («directory index forbidden») — не опасно
    # (список файлов не отдаётся), но для робота это ошибка доступа, а не 404.
    # Остальные каталоги без index.html (/media/, /_astro/, /feed/) — это
    # файловые папки, 403 на них уместен.
    location = /models/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # HTTP/2
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/vfd74.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vfd74.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Разрешаем больше запросов в одном keepalive-соединении
    keepalive_timeout 65;
    keepalive_requests 1000;
}

# www -> apex (канонический домен — vfd74.ru, без www)
server {
    listen 443 ssl http2;
    server_name www.vfd74.ru;

    ssl_certificate /etc/letsencrypt/live/vfd74.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vfd74.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://vfd74.ru$request_uri;
}

server {
    if ($host = www.vfd74.ru) { return 301 https://$host$request_uri; }
    if ($host = vfd74.ru)     { return 301 https://$host$request_uri; }
    listen 80;
    server_name vfd74.ru www.vfd74.ru;
    return 404;
}
