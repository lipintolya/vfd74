# /etc/nginx/conf.d/vfd74-security.conf — контекст http.
# Защита vfd74.ru от флуда и сканеров. Сам vhost — vfd74.ru.conf, он
# подключает зоны отсюда (limit_req / limit_conn). Применять: README.md.
#
# Это защита от одного-нескольких адресов (боты, парсеры, сканеры, «кто-то
# запустил скрипт»). Объёмную DDoS-атаку (забитый канал) nginx на VPS не
# остановит — это делает только фильтрация до сервера (см. README.md).

# Версия nginx в заголовке Server и на страницах ошибок не нужна никому, кроме сканеров.
server_tokens off;

# ── Лимиты на один IP ──────────────────────────────────────────────────────
# Пороги щедрые: у мобильных операторов за одним IP (CGNAT) сидят сотни
# абонентов, а Яндекс-робот обходит каталог пачками. Цель — отрезать скрипт,
# который долбит сервер, а не человека, листающего каталог.
#
# Страницы (HTML, sitemap, фид) — 10 в секунду, всплеск до 50. Статику
# (картинки, шрифты, js/css) эта зона не считает: пустой ключ = без лимита.
map $uri $vfd_page_limit_key {
    default                                                              $binary_remote_addr;
    ~^/(_astro|media|renders|fonts|favicons|icons|pdf)/                  "";
    ~*\.(webp|jpe?g|png|gif|svg|ico|avif|mp4|webm|woff2?|css|js|pdf)$    "";
}
limit_req_zone $vfd_page_limit_key  zone=vfd_pages:10m rate=10r/s;

# Все запросы вместе — 50 в секунду, всплеск до 300: карточная страница
# каталога тянет за раз 40–80 картинок, HTTP/2 шлёт их пачкой.
limit_req_zone $binary_remote_addr  zone=vfd_all:10m   rate=50r/s;

# Одновременные запросы с одного IP. В HTTP/2 limit_conn считает каждый
# параллельный запрос (поток), а не TCP-соединение: каталог тянет десятки
# картинок разом, у nginx до 128 потоков на соединение. Порог 200 — выше
# одной вкладки браузера, но ниже тысяч висящих соединений флудера.
limit_conn_zone $binary_remote_addr zone=vfd_conn:10m;

# 429 Too Many Requests вместо 503: роботы поисковиков понимают его как «помедленнее».
limit_req_status  429;
limit_conn_status 429;
# error, а не warn: в nginx.conf Ubuntu error_log пишет только с уровня error,
# warn в лог не попадает. По этим строкам fail2ban (jail nginx-limit-req) банит.
limit_req_log_level  error;
limit_conn_log_level error;

# Лимиты — на уровне http: действуют на все server (сайт, www → apex,
# http → https, заглушка для чужих имён). location со своим limit_req
# унаследованные отменяет — своих не заводить.
limit_req  zone=vfd_pages burst=50  nodelay;
limit_req  zone=vfd_all   burst=300 nodelay;
limit_conn vfd_conn 200;

# ── Медленные клиенты (slowloris) ──────────────────────────────────────────
# Держать соединение, присылая заголовки по байту, — дешёвый способ занять
# все слоты. 10 с на заголовки и тело хватает даже на плохом мобильном.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          20s;
reset_timedout_connection on;

# Сайт статический: форм и загрузок на наш сервер нет — большое тело запроса
# никому не нужно.
client_max_body_size 16k;
