# /etc/fail2ban/filter.d/vfd74-probe.conf
# Строки access.log nginx (формат combined) с кодом 444 — так vfd74.ru.conf
# отвечает сканерам (.env, .git, wp-*, *.php) и запросам на чужое имя / голый IP.
# Живой посетитель 444 не получает: таких путей на сайте нет.
[Definition]
# Дату fail2ban вырезает из строки до проверки — в шаблоне её нет.
failregex = ^<HOST> [^"]*"[^"]*" 444\s
ignoreregex =
